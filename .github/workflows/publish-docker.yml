name: Publish Docker image

on:
  release:
    types: [published]
  # Manual runs must be started from a version tag (choose it under "Use workflow from")
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to GitHub Container Registry with GITHUB_TOKEN

env:
  IMAGE: ghcr.io/ridrupasinghe/sse-to-mqtt-node

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same guard as the npm workflow: v0.1.2 only publishes if package.json says 0.1.2
      - name: Check tag matches package.json version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Run this workflow from a version tag, not a branch"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.1.2 -> tags 0.1.2, 0.1 and latest (latest is skipped for pre-releases like 0.2.0-beta.1)
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build and run the image once before pushing anything
      - name: Smoke test
        run: |
          docker build -t smoke .
          VERSION="$(docker run --rm smoke --version)"
          echo "Image reports version $VERSION"
          [ "$VERSION" = "${GITHUB_REF_NAME#v}" ]

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
