name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub prove to npm who is publishing (trusted publishing)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Stops a release tagged v0.1.2 from publishing if package.json still says 0.1.1
      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi

      # prepublishOnly runs typecheck, lint, tests and a clean build before publishing.
      # No NPM_TOKEN needed: npm gets a short lived token from GitHub via OIDC.
      - name: Publish
        run: npm publish --provenance --access public